name: comprobar script y preparar version

on:
  push:
    branches:
      - main
  workflow_dispatch:    

permissions:
  contents: read

jobs:
  preparar:
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Ejecutar script
        shell: pwsh
        run: ./despliegar.ps1 -RutaPHP 'php'
      - name: Guardar versión preparada  
        uses: actions/upload-artifact@v4
        with:
          name: version-preparada
          path: pruebas/index.php
           if-no-files-foud:error